{{- if .Values.monitoring.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "news.fullname" . }}
  labels:
    {{- include "news.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "news.name" . }}
  endpoints:
    - port: http
      path: /api/metrics
      interval: 30s
{{- end }}
